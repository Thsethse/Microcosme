<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b22"><title>Microcosme</title><style>body{font-family:system-ui;background:#14251e;color:#f1f5e9;margin:0;padding:18px}main{max-width:800px;margin:auto}h1{margin:5px 0}p{color:#bfd0c0}.panel{background:#20392c;border:1px solid #45624a;border-radius:14px;padding:14px;margin:12px 0}button{background:#b9d88b;color:#17291e;border:0;border-radius:9px;padding:12px;margin:4px;font-weight:700}button:active{opacity:.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#2c4937;padding:10px;border-radius:9px}.map{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}.tile{aspect-ratio:1;background:#41694a;display:grid;place-items:center;border-radius:5px;font-size:clamp(16px,4vw,27px)}.log{max-height:170px;overflow:auto;font-size:13px}small{color:#bed0b9}</style><main><h1>🌱 Microcosme</h1><p>Un village autonome. Observe ses habitants, accélère le temps et aide-les à survivre.</p><section class="panel"><div class="stats" id="stats"></div><div><button onclick="step()">+ 1 jour</button><button id="auto" onclick="toggle()">▶ Automatique</button><button onclick="add()">+ Habitant (8 🍞)</button><button onclick="gift()">Donner 10 🍞</button></div><small>Les habitants mangent chaque jour. Ils cultivent, récoltent du bois ou se reposent selon les besoins du village.</small></section><section class="panel"><h3>Le territoire</h3><div class="map" id="map"></div></section><section class="panel"><h3>Habitants</h3><div id="people"></div></section><section class="panel"><h3>Journal</h3><div class="log" id="log"></div><button onclick="reset()">Recommencer</button></section></main><script>
const KEY="microcosme-v01";let state;let timer=null;
const names=["Alix","Basile","Céleste","Dorian","Éloïse","Félix","Gaëlle","Hugo","Iris","Jules","Lina","Milo"];
function fresh(){return {day:1,food:24,wood:8,fields:3,people:names.slice(0,5).map((name,i)=>({name,energy:65+i*5,age:18+i*4,job:"Découvre le village"})),events:["Jour 1 : le village s'éveille."]}}
try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function note(t){state.events.unshift("J"+state.day+" — "+t);state.events=state.events.slice(0,60)}
function step(){state.day++;let p=state.people;let harvest=0,wood=0;for(let h of p){h.age+=1/365;if(h.energy<25){h.energy=Math.min(100,h.energy+42);h.job="Se repose 💤"}else if(state.food<p.length*4){harvest+=2+state.fields;h.energy-=18;h.job="Cultive 🌾"}else if(state.wood<12){wood+=3;h.energy-=20;h.job="Coupe du bois 🪵"}else if(Math.random()<.5){harvest+=2;h.energy-=12;h.job="Récolte 🍎"}else{h.energy=Math.min(100,h.energy+22);h.job="Se repose 💤"}}state.food+=harvest;state.wood+=wood;let hungry=0;for(let h of p){if(state.food>0)state.food--;else{h.energy-=24;hungry++}}if(hungry)note(hungry+" habitant(s) ont faim.");if(harvest)note("Récolte de "+harvest+" nourriture.");if(wood)note("Bois récolté : "+wood+".");state.people=state.people.filter(h=>{if(h.energy<=-25){note(h.name+" a quitté le village.");return false}return true});if(state.day%10===0&&state.wood>=6){state.wood-=6;state.fields++;note("Un nouveau champ est aménagé !")}if(!state.people.length)note("Le village est désert.");save();render()}
function add(){if(state.food<8){note("Pas assez de nourriture pour accueillir quelqu'un.");render();return}state.food-=8;let name=names.find(n=>!state.people.some(p=>p.name===n))||"Habitant "+(state.people.length+1);state.people.push({name,energy:80,age:20,job:"Arrive au village"});note(name+" rejoint le village.");save();render()}
function gift(){state.food+=10;note("Une aide providentielle apporte 10 nourriture.");save();render()}
function reset(){if(confirm("Recommencer le monde ?")){state=fresh();save();render()}}
function toggle(){if(timer){clearInterval(timer);timer=null}else timer=setInterval(step,1000);render()}
function render(){document.getElementById("stats").innerHTML=[["📅 Jour",state.day],["👥 Habitants",state.people.length],["🍞 Nourriture",state.food],["🪵 Bois",state.wood],["🌾 Champs",state.fields],["⚡ Énergie moyenne",state.people.length?Math.round(state.people.reduce((a,p)=>a+p.energy,0)/state.people.length):0]].map(x=>"<div><small>"+x[0]+"</small><br><b>"+x[1]+"</b></div>").join("");document.getElementById("auto").textContent=timer?"⏸ Pause":"▶ Automatique";let tiles=Array.from({length:64},(_,i)=>i===27?"🏘️":i===28?"🏠":i===35?"🏡":i%11<state.fields%11?"🌾":i%7===0?"🌲":i%13===0?"🌳":"🌿");document.getElementById("map").innerHTML=tiles.map(t=>'<div class="tile">'+t+'</div>').join("");document.getElementById("people").innerHTML=state.people.map(p=>'<p>🧑 <b>'+p.name+'</b> — '+p.job+' · énergie '+Math.max(0,Math.round(p.energy))+'%</p>').join("")||"<p>Plus aucun habitant.</p>";document.getElementById("log").innerHTML=state.events.map(e=>"<p>"+e+"</p>").join("")}render();
</script></html>
