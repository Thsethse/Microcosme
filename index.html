<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14291f"><title>Microcosme v0.2</title><style>body{background:#14291f;color:#f0f5e9;font:15px system-ui;margin:0;padding:14px}main{max-width:820px;margin:auto}h1{margin:6px 0}p,small{color:#c5d7c5}.panel{background:#213b2d;border:1px solid #476c4d;border-radius:13px;padding:12px;margin:12px 0}button,select{border:0;border-radius:9px;padding:10px;background:#c6e19c;color:#18301e;font-weight:650;margin:3px}button.selected{background:#f7cc75}input{width:100%}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;touch-action:manipulation}.tile{position:relative;aspect-ratio:1;background:#527b4c;border-radius:3px;display:grid;place-items:center;font-size:clamp(12px,3.1vw,25px);user-select:none}.person{position:absolute;right:-2px;bottom:-4px;font-size:clamp(12px,3.2vw,23px);filter:drop-shadow(0 1px 2px #000)}.stats{display:flex;flex-wrap:wrap;gap:12px}.stats span{background:#34533b;padding:8px;border-radius:8px}.log{max-height:130px;overflow:auto}label{display:block;margin:12px 0}#inspect{min-height:30px}h3{margin:4px 0 10px}</style><main><h1>🌱 Microcosme <small>v0.2</small></h1><p>Observe un monde autonome. Modifie ses lois ou touche une case pour intervenir.</p><div class="panel"><div class="stats" id="stats"></div><button onclick="step()">+ 1 heure</button><button id="auto" onclick="toggle()">▶ Temps</button><button onclick="speed()">Vitesse ×<span id="speed">1</span></button></div><div class="panel"><h3>🌍 Le monde</h3><div>Outil : <button class="selected" data-tool="inspect" onclick="tool('inspect')">🔎 Observer</button><button data-tool="tree" onclick="tool('tree')">🌲 Arbre</button><button data-tool="food" onclick="tool('food')">🌾 Nourriture</button><button data-tool="person" onclick="tool('person')">🧑 Habitant</button></div><div class="grid" id="map"></div><p id="inspect">Touche un habitant pour découvrir ce qu'il fait et pourquoi.</p></div><div class="panel"><h3>⚙️ Lois du monde</h3><label>Faim : <b id="hungerValue"></b><input id="hunger" type="range" min="0" max="4" step="1" oninput="law('hunger',this.value)"></label><label>Production : <b id="productivityValue"></b><input id="productivity" type="range" min="1" max="5" step="1" oninput="law('productivity',this.value)"></label><label>Sociabilité : <b id="socialValue"></b><input id="social" type="range" min="0" max="100" step="10" oninput="law('social',this.value)"></label></div><div class="panel"><h3>📜 Événements</h3><div class="log" id="log"></div><button onclick="restart()">Recommencer cette expérience</button></div></main><script>
const W=12,H=9,K='microcosme-v02';let s,clock=null,rate=1,active='inspect',selected=null;
const names=['Alix','Basile','Céleste','Dorian','Éloïse','Félix','Gaëlle','Hugo','Iris','Jules','Lina','Milo'];
const idx=(x,y)=>y*W+x;const xy=i=>[i%W,Math.floor(i/W)];const rand=n=>Math.floor(Math.random()*n);
function initial(){let tiles=Array.from({length:W*H},(_,i)=>Math.random()<.20?'tree':Math.random()<.13?'field':'grass');[39,40,41,51,52,53].forEach(i=>tiles[i]='grass');tiles[40]='home';tiles[52]='home';return{hour:8,day:1,food:20,wood:3,tiles,people:names.slice(0,5).map((name,i)=>({id:i+1,name,pos:39+i*3,energy:75,hunger:15,task:'observe',target:null,reason:'Découvre le village',social:40+rand(50)})),laws:{hunger:2,productivity:2,social:30},events:['Le village s’éveille.']}}
try{s=JSON.parse(localStorage.getItem(K))||initial();if(!s.tiles||!s.people)throw 0}catch(e){s=initial()}
function save(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}
function log(t){s.events.unshift('Jour '+s.day+' : '+t);s.events=s.events.slice(0,35)}
function nearest(pos,kind){let [x,y]=xy(pos),best=null,d=1e9;s.tiles.forEach((t,i)=>{if(t!==kind)return;let [a,b]=xy(i),v=Math.abs(a-x)+Math.abs(b-y);if(v<d){d=v;best=i}});return best}
function move(p,t){if(t===null||t===undefined)return false;if(p.pos===t)return true;let [x,y]=xy(p.pos),[a,b]=xy(t);if(x!==a)x+=Math.sign(a-x);else if(y!==b)y+=Math.sign(b-y);p.pos=idx(x,y);return p.pos===t}
function step(){s.hour++;if(s.hour>=24){s.hour=0;s.day++;log('Un nouveau jour commence.')}for(let p of s.people){p.hunger=Math.min(130,p.hunger+s.laws.hunger);p.energy=Math.max(0,p.energy-1);if(p.hunger>=55&&s.food>0){s.food--;p.hunger=Math.max(0,p.hunger-40);p.reason='Mange pour calmer sa faim';p.task='eat';continue}if(p.energy<25){p.task='rest';p.reason='Épuisé, cherche à se reposer';p.target=nearest(p.pos,'home');if(move(p,p.target))p.energy=Math.min(100,p.energy+18);continue}if(s.food<Math.max(12,s.people.length*5)){p.task='farm';p.reason='Les réserves de nourriture sont basses';p.target=nearest(p.pos,'field');if(move(p,p.target)){s.food+=s.laws.productivity;p.energy-=3}continue}if(s.wood<12){p.task='wood';p.reason='Le village manque de bois';p.target=nearest(p.pos,'tree');if(move(p,p.target)){s.wood+=s.laws.productivity;p.energy-=4}continue}if(rand(100)<s.laws.social){let other=s.people.find(q=>q.id!==p.id);if(other){p.task='social';p.reason='Souhaite rencontrer '+other.name;move(p,other.pos);if(p.pos===other.pos&&rand(6)===0)log(p.name+' discute avec '+other.name);continue}}p.task='wander';p.reason='Explore les alentours';let [x,y]=xy(p.pos);p.pos=idx(Math.max(0,Math.min(W-1,x+rand(3)-1)),Math.max(0,Math.min(H-1,y+rand(3)-1)))}save();render()}
function tool(v){active=v;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('selected',b.dataset.tool===v))}
function tap(i){let p=s.people.find(p=>p.pos===i);if(active==='inspect'){selected=p?.id||null;document.getElementById('inspect').textContent=p?p.name+' — '+p.reason+'. Énergie '+p.energy+'%, faim '+p.hunger+'%.': 'Case '+s.tiles[i]+' : '+(s.tiles[i]==='field'?'culture':s.tiles[i]==='tree'?'forêt':'terrain');return}if(active==='person'){let id=Math.max(0,...s.people.map(p=>p.id))+1;let name=names.find(n=>!s.people.some(p=>p.name===n))||'Habitant '+id;s.people.push({id,name,pos:i,energy:85,hunger:10,task:'new',target:null,reason:'Vient d’arriver',social:50});log(name+' arrive au village.')}else{s.tiles[i]=active==='tree'?'tree':'field';log(active==='tree'?'Un arbre apparaît.':'Une culture apparaît.')}save();render()}
function law(k,v){s.laws[k]=Number(v);save();document.getElementById(k+'Value').textContent=v}
function toggle(){if(clock){clearInterval(clock);clock=null}else clock=setInterval(step,600/rate);render()}
function speed(){rate=rate===1?2:rate===2?4:1;if(clock){clearInterval(clock);clock=setInterval(step,600/rate)}render()}
function restart(){if(confirm('Effacer cette simulation et recommencer ?')){s=initial();selected=null;save();render()}}
function render(){document.getElementById('stats').innerHTML='<span>📅 J'+s.day+' · '+s.hour+'h</span><span>👥 '+s.people.length+'</span><span>🍞 '+s.food+'</span><span>🪵 '+s.wood+'</span>';document.getElementById('auto').textContent=clock?'⏸ Pause':'▶ Temps';document.getElementById('speed').textContent=rate;let emoji={tree:'🌲',field:'🌾',home:'🏠',grass:'·'};document.getElementById('map').innerHTML=s.tiles.map((t,i)=>'<div class="tile" onclick="tap('+i+')">'+emoji[t]+s.people.filter(p=>p.pos===i).map(p=>'<span class="person" title="'+p.name+'">🧑</span>').join('')+'</div>').join('');document.getElementById('log').innerHTML=s.events.map(e=>'<p>'+e+'</p>').join('');for(let k of ['hunger','productivity','social']){document.getElementById(k).value=s.laws[k];document.getElementById(k+'Value').textContent=s.laws[k]}if(selected){let p=s.people.find(p=>p.id===selected);if(p)document.getElementById('inspect').textContent=p.name+' — '+p.reason+'. Énergie '+p.energy+'%, faim '+p.hunger+'%.'}}render();
</script></html>
