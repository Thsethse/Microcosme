<section id="resident-preview" aria-labelledby="resident-title">
  <h2 id="resident-title">Habitants témoins</h2>
  <div class="actions">
    <label>Habitant <select><option value="0">Témoin F</option><option value="1">Témoin H</option></select></label>
    <button id="resident-open" type="button">Afficher le témoin</button>
  </div>
  <p>Identité affichée <output></output></p>
  <div class="resident-views comparison"></div>
  <details><summary>Caractéristiques canoniques</summary><pre></pre></details>
  <label>Archive de l’habitant<textarea id="resident-archive" rows="7" spellcheck="false"></textarea></label>
  <div class="actions">
    <button id="resident-export" type="button">Exporter l’habitant</button>
    <button id="resident-import" type="button">Restaurer l’habitant</button>
  </div>
  <p role="status"></p>
  <p role="alert"></p>
</section>
