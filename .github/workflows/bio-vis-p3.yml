name: BIO-VIS-P3
on:
  pull_request:
    paths: ['bio-vis-p3/**', '.github/workflows/bio-vis-p3.yml']
permissions:
  contents: read
jobs:
  morphology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test bio-vis-p3/model.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node bio-vis-p3/browser.test.cjs
      - run: node bio-vis-p3/p2-regression.test.cjs
