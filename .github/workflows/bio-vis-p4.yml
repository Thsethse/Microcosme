name: BIO-VIS-P4
on:
  pull_request:
    paths: ['bio-vis-p4/**', '.github/workflows/bio-vis-p4.yml']
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test bio-vis-p4/model.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node bio-vis-p4/browser.test.cjs
      - run: node bio-vis-p4/r1-regression.test.cjs
