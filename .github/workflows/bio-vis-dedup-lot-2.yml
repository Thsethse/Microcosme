name: BIO-VIS-DEDUP — Lot 2
on:
  pull_request:
    paths:
      - 'bio-vis-dedup-lot-2/**'
      - '.github/workflows/bio-vis-dedup-lot-2.yml'
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    # This published Noble image supplies OS libraries only. Browsers are installed
    # using the repository's locked Playwright version; no engine is downgraded.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test bio-vis-dedup-lot-2/tests/model.test.mjs
      - run: npx playwright install chromium webkit
      - run: node bio-vis-dedup-lot-2/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bio-vis-dedup-lot-2-comparaisons
          path: /tmp/microcosme-dedup-lot2-browser
          if-no-files-found: ignore
