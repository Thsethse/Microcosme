name: BIO-YEUX-01 — Formes des yeux
on:
  pull_request:
    paths:
      - 'bio-yeux-01/**'
      - '.github/workflows/bio-yeux-01.yml'
permissions:
  contents: read
jobs:
  yeux:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    env:
      ARTIFACT_DIR: /tmp/microcosme-bio-yeux-01
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test bio-col-01/tests/model.test.mjs bio-yeux-01/tests/model.test.mjs
      - run: npx playwright install chromium webkit
      - name: Rejouer l’interface BIO-YEUX-01 publiée avant A/B/C
        run: |
          legacy_preview=$(mktemp -d)
          git -c safe.directory="$GITHUB_WORKSPACE" archive 0ccaee3f9f8b22541f7ef1f98a35c6882116d718 bio-yeux-01 | tar -x -C "$legacy_preview"
          for directory in bio-col-01 preview node_modules; do
            ln -s "$GITHUB_WORKSPACE/$directory" "$legacy_preview/$directory"
          done
          ARTIFACT_DIR="$ARTIFACT_DIR/historique-yeux" node "$legacy_preview/bio-yeux-01/tests/browser.cjs"
      - run: node --test bio-yeux-01/tests/corrections-*.test.mjs
      - run: node --test bio-yeux-01/tests/iris.test.mjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/iris" node bio-yeux-01/tests/iris-browser.cjs
      - run: node --test bio-yeux-01/tests/details.test.mjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/details" node bio-yeux-01/tests/details-browser.cjs
      - run: node --test bio-yeux-01/tests/brows.test.mjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/brows" node bio-yeux-01/tests/brows-browser.cjs
      - run: node --test bio-yeux-01/tests/mouth.test.mjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/mouth" node bio-yeux-01/tests/mouth-browser.cjs
      - run: node --test bio-yeux-01/tests/nose.test.mjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/nose" node bio-yeux-01/tests/nose-browser.cjs
      - run: node --test bio-yeux-01/tests/beard.test.mjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/pilosite" node bio-yeux-01/tests/beard-browser.cjs
      - run: node --test bio-yeux-01/tests/marks.test.mjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/marques" node bio-yeux-01/tests/marks-browser.cjs
      - run: node --test bio-yeux-01/tests/scars.test.mjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/cicatrices" node bio-yeux-01/tests/scars-browser.cjs
      - name: Démarrage de la distribution Pages des cicatrices
        run: |
          node bio-yeux-01/build-scars-preview.mjs "$ARTIFACT_DIR/cicatrices-pages"
          PREVIEW_DIR="$ARTIFACT_DIR/cicatrices-pages" ARTIFACT_DIR="$ARTIFACT_DIR/cicatrices-demarrage" node bio-yeux-01/tests/scars-startup-browser.cjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/corrections" node bio-yeux-01/tests/corrections-browser.cjs
      - run: ARTIFACT_DIR="$ARTIFACT_DIR/palettes" node bio-col-01/tests/browser.cjs
      - name: Récupérer les suites originales des lots 1 à 3
        run: git -c safe.directory="$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin 1ff931586776b3f7ed41bbdc5772b97e030aa4db 4156254ca5a9b4a52f138a558bd70d461f4d4c4e 576ee961b5be385e6cceb2f357ffe74341b0d05f
      - run: node bio-col-01/tests/legacy.cjs
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bio-yeux-01-comparaisons
          path: /tmp/microcosme-bio-yeux-01
          if-no-files-found: ignore
