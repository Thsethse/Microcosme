name: BIO-VIS-P5-I2
on:
  pull_request:
    paths: ['bio-vis-p5-i2/**', '.github/workflows/bio-vis-p5-i2.yml']
permissions:
  contents: read
jobs:
  lot-b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test bio-vis-p5-i2/model.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node bio-vis-p5-i2/browser.test.cjs
